name: Actualizar Estaciones Met

on:
  repository_dispatch:
    types: [actualizar_estaciones]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias de zona horaria y pytz
        run: pip install tzdata pytz

      - name: Ejecutar script de monitoreo
        run: python index.py

      - name: Guardar cambios y actualizar repositorio
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "action@github.com"
          git add index.html historial_presion.json
          git diff --staged --quiet || (git commit -m "Actualización automática de estaciones y historial [skip ci]" && git push)
